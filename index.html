<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>ImageCraft – Free Online Image Tools</title>

    <meta
      name="description"
      content="Compress, resize, crop, convert, flip, rotate, and edit images directly in your browser. Convert PDFs and more with ImageCraft. No account required – completely free."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- ImageCraft Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://imagecrafttool.vercel.app/"
    />

    <meta
      property="og:title"
      content="ImageCraft – Free Online Image Tools"
    />

    <meta
      property="og:description"
      content="Free online image tools for compression, resizing, cropping, conversion, editing, PDF conversion, and more."
    />

    <meta
      property="og:site_name"
      content="ImageCraft"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:url"
      content="https://imagecrafttool.vercel.app/"
    />

    <meta
      name="twitter:title"
      content="ImageCraft – Free Online Image Tools"
    />

    <meta
      name="twitter:description"
      content="Free online image tools for compression, resizing, cropping, conversion, editing, PDF conversion, and more."
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://imagecrafttool.vercel.app/"
    />
  </head>

  <body class="antialiased">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
